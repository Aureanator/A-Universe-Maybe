[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "constraintnet"
version = "0.1.0"
description = "Discrete simplicial constraint-network simulator: edge labels carry group constraints, legitimate local reductions preserve boundary holonomy, persistent topological defects become matter."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
viz = ["matplotlib>=3.7", "numpy>=1.24"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "slow: tests that take more than a couple of seconds",
]
